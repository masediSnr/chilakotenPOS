<div class="checkout-container">
    <div class="mode">
        <a href="/products/views"><button id="close-ch" class="close-ch btn btn-nav">&times;</button></a>
        <div class="ordered-items">
            <h2>Purchase Item(s)</h2>
            <div class="order-receipt">
                <div class="receipt">
                    <div class="product-header">
                        <div class="noi">#items</div>
                        <div class="iname">Desc</div>
                        <div class="price">Price</div>
                    </div>
                    <div class="product-ord">
                        <div class="noi">1</div>
                        <div class="iname">M: mase pizza</div>
                        <div class="price">29.99</div>
                    </div>
                    <div class="product-ord">
                        <div class="noi">1</div>
                        <div class="iname">2l: Sprite</div>
                        <div class="price">28.99</div>
                    </div>
                    <div class="product-ord">
                        <div class="noi">3</div>
                        <div class="iname">regular: Hot dogs</div>
                        <div class="price">
                            <span>@12.99</span>
                            <span>@12.99</span>
                            <span>@12.99</span>
                        </div>
                    </div>
                    <div class="product-ord">
                        <div class="noi">1</div>
                        <div class="iname">L: Fried Chips</div>
                        <div class="price">34.99</div>
                    </div>
                </div>
                <div class="receipt-totals">
                    <div class="amount-tot">
                        <span>Item(s) price:</span>
                        <span>120.50</span>
                    </div>
                    <div class="amount-tot">
                        <span>Cash:</span>
                        <span>130.00</span>
                    </div>
                    <div class="amount-tot">
                        <span>Change:</span>
                        <span>9.50</span>
                    </div>
                    
                </div>
            </div>
        </div>
        <div class="calculator-sec">
            <div class="mold-cover">
                <div class="screen">
                    <div class="calcs">
                        <ul>
                            <li><span>Items Price:</span><span>R120.50</span></li>
                            <li><span>Cash Amount:</span><span>R130.00</span></li>
                            <li><span>Change:</span><span>R9.50</span></li>
                        </ul>
                    </div>
                    <input type="text" name="calcAmount" id="" placeholder="ENTER CASH AMOUNT">
                </div>
                <div class="buttons">
                    <div class="calc-btn" style="grid-area: box1;">1</div>
                    <div class="calc-btn" style="grid-area: box2;">2</div>
                    <div class="calc-btn" style="grid-area: box3;">3</div>
                    <div class="calc-btn" style="grid-area: box4;">4</div>
                    <div class="calc-btn" style="grid-area: box5;">5</div>
                    <div class="calc-btn" style="grid-area: box6;">6</div>
                    <div class="calc-btn" style="grid-area: box7;">7</div>
                    <div class="calc-btn" style="grid-area: box8;">8</div>
                    <div class="calc-btn" style="grid-area: box9;">9</div>
                    <div class="calc-btn" style="grid-area: box10;">,</div>
                    <div class="calc-btn" style="grid-area: box11;">0</div>
                    <div class="calc-btn" style="grid-area: box12;">00</div>
                    <div class="calc-btn" style="grid-area: box13;">clear</div>
                    <div class="calc-btn" style="grid-area: box14;">Enter</div>
                </div>
            </div>
            <button value="paying">Place Order</button>
        </div>
    </div>
</div>
